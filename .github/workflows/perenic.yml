name: PerenicAI PAT quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest

  review:
    # Only review pull requests (it looks at the files the PR changed).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so we can compare with the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Review changed Python files
        env:
          # Optional. Add it under Settings > Secrets and variables > Actions
          # to turn on Claude reviews. Without it, rule-based checks run.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional. Set a repository variable named PERENIC_INDUSTRY to
          # "healthcare" or "finance" to add that industry's PAT agent.
          PERENIC_INDUSTRY: ${{ vars.PERENIC_INDUSTRY }}
        run: |
          # examples/ and tests/ are excluded because they contain flawed code
          # and fake sensitive data on purpose, to exercise the PAT agents.
          files=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- '*.py' ':!examples/' ':!tests/')
          if [ -z "$files" ]; then
            echo "No Python files changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          industry_option=""
          if [ -n "$PERENIC_INDUSTRY" ]; then
            industry_option="--industry $PERENIC_INDUSTRY"
          fi
          python -m perenic review $files $industry_option --markdown | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}
